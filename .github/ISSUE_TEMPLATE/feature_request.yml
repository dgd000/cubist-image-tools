name: Feature request
description: Suggest an improvement to the local image tools.
body:
  - type: textarea
    id: problem
    attributes:
      label: What task would this help you complete?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Proposed behavior
      description: Please explain how it fits a browser-local tool without accounts or API keys.
